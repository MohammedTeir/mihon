name: Build signed APK

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Mihon's build reads git info

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Align and sign APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BT"
          mkdir -p signed

          # Release builds may produce several APKs (per ABI + universal).
          find app/build/outputs/apk -name "*-unsigned.apk" | while read -r apk; do
            name="$(basename "$apk" -unsigned.apk)"
            "$BT/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/$name-aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "signed/$name-signed.apk" \
              "$RUNNER_TEMP/$name-aligned.apk"
            "$BT/apksigner" verify "signed/$name-signed.apk"
          done

          ls -lh signed
          test -n "$(ls -A signed)" || { echo "No APKs were signed"; exit 1; }

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: signed/*.apk
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
